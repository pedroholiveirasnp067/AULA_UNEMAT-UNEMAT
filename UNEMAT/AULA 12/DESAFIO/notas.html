<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Calculadora de notas</title>
    <script src="notas.js" defer></script>
</head>
<body>
    <h1>Calculadora de notas</h1>
    <form action="" method="">
        <fieldset>
            <legend>Informações do aluno</legend>
            <label for="nome">Nome do aluno:</label><br>
            <input id="nome" name="nome" type="text" placeholder="Nome do aluno..."><br>
        </fieldset>
        <fieldset>
            <legend>Notas</legend>
            <label for="nota1">Primeira nota</label><br>
            <input id="nota1" name="nota1" type="number" placeholder="primeira nota"><br>
            <label for="nota2">Segunda nota</label><br>
            <input id="nota2" name="nota2" type="number" placeholder="segunda nota"><br>
            <label for="nota3">Terceira nota</label><br>
            <input id="nota3" name="nota3" type="number" placeholder="terceira nota"><br>
        </fieldset>
    </form>
    <button id="botaoCalcular">Calcular</button>
    <p id="resultado"></p>
</body>
</html>
