<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitezin dos cria</title>
    <style>
        body {
            height: 10000px;
        }
        #principal {
            height: 1000px;
            border: solid 1px red;
        }
        button a {
            text-decoration: none;
            color: black;
        }
        button {
            text-decoration: black;
            border: solid 0px;
            width: 120px;
            height: 30px;
            background-color: orange;
            border-radius: 20px;
            font-family:'Times New Roman', Times, serif;
            font-size: 20px;
        }
        button:hover {
            transition: 0.3s;
            width: 500px;
            height: 50px;
            background-color: red;
            border-radius: 30px;
            font-size: 25px;
        }
        button:not(hover) {
            transition: 0.3s;
            width: 120px;
            height: 30px;
            background-color: orange;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div>
        <button><a href="#principal2">botao</a></button>
    </div>
    <div id="principal">
        <h1>titulo pica</h1>

        <p>linha2</p>
        <p>linha3</p>

    </div>

</html>
