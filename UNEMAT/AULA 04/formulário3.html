<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 3</title>
</head>
<body>
    <h1>Formulário 3</h1>
    <form action="https://ivanpires.dev/processa.php" method="post">
        <label for="estados">Estados:</label>
        <select name="estados" id="estados">
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="MT" selected>Mato Grosso</option>
        </select>
        <br>
        <label for="cidades">Cidade:</label>
        <input type="text" name="cidades" id="cidades" list="listacidades">
        <datalist id="listacidades">
            <option value="sinop">Sinop</option>
            <option value="cuiabrasa">Cuiabá</option>
            <option value="itauba">Itaúba</option>
        </datalist>
        <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
